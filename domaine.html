<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:type" content="website">
<meta property="og:site_name" content="AllWine">
<meta property="og:title" content="Domaines of the Côte d'Or — AllWine">
<meta property="og:description" content="Each domaine's vineyards on INAO's surveyed plan, with hectares and shares.">
<meta property="og:image" content="https://allwine.dk/atlas-preview.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#7C2D3E">
<script src="config.js?v=4"></script>
<style>
:root{
  --bg:#F7F4F1; --card:#FFFFFF; --card2:#FBF9F7; --ink:#2A2126; --muted:#756A70;
  --line:#E7DFDD; --accent:#7C2D3E; --accent-ink:#FFFFFF; --gold:#A87E2F; --chip:#F1EBE8;
  --shadow:0 1px 2px rgba(42,33,38,.05),0 4px 16px rgba(42,33,38,.06);
  /* map */
  --gc:#8E2C45; --gc-ink:#FFFFFF; --pc:#D88E7C; --pc-ink:#3A1A21; --vc:#ECDDB9; --vc-ink:#5B4A2E;
  --base:#F3EAD6; --plain:#F4F1EA; --forest:#DCE5D3; --forest-ink:#6E8366; --water:#7FA8C9;
  --road:#B9AEA8; --town:#E2DAD6; --town-ink:#8A7D82; --sel:#1F1418; --seq0:#F2E6E1; --seq1:#7C2D3E;
  --none:#EEE8E3; --mapbg:#F4F1EA;
  --wall:#A89679; --house:#C9BBB2; --house-ink:#9C8B82; --rfill:#FFFFFF; --rcase:#C9BDB6; --contour:#9B7E5C;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171114; --card:#221A1F; --card2:#281F24; --ink:#EFE7E8; --muted:#A5949C;
    --line:#382C32; --accent:#C86A7C; --accent-ink:#1D1216; --gold:#C99B47; --chip:#2E2329;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --gc:#B6475F; --gc-ink:#FFF4F6; --pc:#8A4E44; --pc-ink:#FBE9E4; --vc:#4D4232; --vc-ink:#E8DCC2;
    --base:#3A3229; --plain:#241E20; --forest:#23302A; --forest-ink:#86A08A; --water:#4F7A9C;
    --road:#5E5257; --town:#3A3035; --town-ink:#B3A3AA; --sel:#FFFFFF; --seq0:#3A2E31; --seq1:#E07A90;
    --none:#2C2427; --mapbg:#1E181B;
    --wall:#8A7A62; --house:#5C4E55; --house-ink:#7A6A71; --rfill:#4A3F44; --rcase:#2A2226; --contour:#B89A73;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:1600px;margin:0 auto;padding:18px clamp(12px,2.2vw,36px) 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
header.top h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:clamp(22px,3.4vw,32px);font-weight:600;margin:0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header.top h1 em{font-style:italic;color:var(--accent)} header.top h1 a{color:inherit;text-decoration:none}
header.top .ttl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
header.top .ttl a{color:inherit;text-decoration:none} header.top .ttl a:hover{color:var(--accent)}
.hright{display:flex;align-items:center;gap:14px}
.langpick{display:flex;gap:4px}
.langpick button{width:30px;height:21px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;overflow:hidden;opacity:.55;transition:opacity .15s}
.langpick button svg{width:100%;height:100%;display:block}
.langpick button:hover{opacity:.9}
.langpick button.on{opacity:1;box-shadow:0 0 0 2px var(--accent)}
@media(pointer:coarse){.langpick button{width:32px!important;height:24px!important} table.own a,.note a{display:inline-block;padding:4px 0} .back{display:inline-block;padding:4px 0}}
.back{font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
.btn{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;min-height:38px}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
input,select{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;height:40px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.listbar{display:flex;gap:8px;margin-bottom:12px} .listbar input{flex:1;max-width:420px;font-size:16px}
.ph{color:var(--muted);font-size:13px}
.lhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap} .lhead h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;margin:4px 0 10px}
.dlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.dlist a{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);min-height:44px}
.dlist a:hover{border-color:var(--accent)} .dlist b{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:17px;font-weight:600} .dlist span{color:var(--muted);font-size:12.5px}
/* one domaine */
.dhead h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:clamp(28px,4.4vw,44px);font-weight:600;margin:6px 0 2px;line-height:1.1}
.pills{display:flex;gap:6px;flex-wrap:wrap} .pill{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--chip);color:var(--ink)}
.meta{color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.dgrid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:start;margin-top:14px}
@media(max-width:900px){.dgrid2{grid-template-columns:1fr} .dgrid2:has(.mapfig.one) .dright{order:-1}}
@media(max-width:600px){header.top .ttl{display:none} header.top h1{font-size:24px}}
.dright:has(.mapfig.one){position:sticky;top:12px}
@media(max-width:900px){.dright{position:static}}
.mapfig{margin:0 0 12px} .mapfig figcaption{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 4px 2px;font-weight:700}
.dmap{display:block;width:100%;height:min(46vh,440px);background:var(--mapbg);border:1px solid var(--line);border-radius:12px}
.mapfig.one .dmap{height:min(78vh,820px)}
@media(max-width:900px){.dmap{height:42svh} .mapfig.one .dmap{height:56svh}}
.dmap .mv{fill:var(--base);stroke:var(--muted);stroke-opacity:.35;stroke-width:1;vector-effect:non-scaling-stroke}
.dmap .mc{fill:var(--none);stroke:var(--mapbg);stroke-width:1;vector-effect:non-scaling-stroke}
.dmap .mh{stroke:var(--mapbg);stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer}
.dmap .mh.GC{fill:var(--gc)} .dmap .mh.p1{fill:var(--pc)} .dmap .mh.V{fill:var(--vc)} .dmap .mh.buys{fill-opacity:.35;stroke:var(--gold);stroke-dasharray:3 2}
.dmap a:hover .mh{stroke:var(--sel);stroke-width:2.4}
.dmap .mb circle{fill:var(--card);stroke:var(--ink);stroke-width:1.2;vector-effect:non-scaling-stroke}
.dmap .mb text{text-anchor:middle;dominant-baseline:central;font-weight:700;fill:var(--ink);pointer-events:none}
.dmap .mb{pointer-events:none}
.mapnote{margin:6px 2px 0}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 12px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.fact .l{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.fact .v{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:22px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums} .fact small{font-size:13px;color:var(--muted)}
@media(max-width:600px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lead{font-size:16px;line-height:1.6}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:20px 0 6px;font-weight:700}
.clsbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:8px 0 6px;gap:2px}
.clsbar span.GC,.clsleg i.GC,.cls.GC{background:var(--gc)} .clsbar span.p1,.clsleg i.p1,.cls.p1{background:var(--pc)} .clsbar span.V,.clsleg i.V,.cls.V{background:var(--vc)}
.clsleg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)} .clsleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px} .clsleg b{color:var(--ink)}
table.own{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.own th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.own td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top} table.own tr:first-child td{border-top:0}
table.own .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums} table.own .num{color:var(--muted);font-variant-numeric:tabular-nums;width:2.2em}
table.own a{color:var(--ink);font-weight:600;text-decoration:none} table.own a:hover{color:var(--accent);text-decoration:underline}
table.own .sub{font-size:12px;color:var(--muted)} table.own tr.buys td{color:var(--muted)}
table.own.small td{padding:6px 10px}
.cls{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.ktag{font-size:10.5px;font-weight:700;border-radius:10px;padding:0 6px;background:var(--chip);color:var(--muted);white-space:nowrap}
.ktag.s{color:color-mix(in srgb,var(--gold) 68%,var(--ink))}
.note{font-size:13px;color:var(--muted)} .fine{margin-top:18px;max-width:80ch}
@media print{header.top .hright,.acts,.listbar{display:none!important} body{background:#fff} .dgrid2{grid-template-columns:1fr} .dright{position:static;order:0} .dmap{height:auto;aspect-ratio:1.3;break-inside:avoid}}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1><a href="./">All<em>Wine</em></a><span class="ttl"><a href="burgundy.html" data-i18n>Burgundy atlas</a> · <a href="domaine.html" data-i18n>Domaines</a></span></h1>
  <div class="hright"><div data-langpick></div><a class="back" href="burgundy.html" data-i18n>← Atlas</a></div>
</header>
<main>
<div class="listbar" id="listBar">
  <input type="search" id="dq" placeholder="Find a domaine…" aria-label="Find a domaine" data-i18n-ph data-i18n-aria autocomplete="off">
  <select id="ds" aria-label="Sort domaines" data-i18n-aria><option value="ha" data-i18n>Most hectares</option><option value="gc" data-i18n>Most grands crus</option><option value="az" data-i18n>A–Z</option></select>
</div>
<div id="main"></div>
</main>
</div>
<script src="i18n.js?v=24"></script>
<script src="burgundy-i18n-da.js?v=5"></script>
<script src="burgundy-i18n-fr.js?v=5"></script>
<script src="burgundy-i18n-de.js?v=1"></script>
<script src="burgundy-data.js?v=13"></script>
<script src="burgundy-data-beaune.js?v=12"></script>
<script src="burgundy-geo.js?v=7"></script>
<script src="burgundy-extras.js?v=5"></script>
<script src="domaine.js?v=2"></script>
</body>
</html>
