# The AllWine API gateway (index.js). Deploy from this folder with `npx wrangler deploy` (Wrangler 4.36 or later),
# then set the secrets once:
#   npx wrangler secret put API_URL            # the Apps Script web app URL (…/exec)
#   npx wrangler secret put GATEWAY_SECRET     # the same long random value as GATEWAY_SECRET in Settings.gs
#   npx wrangler secret put TURNSTILE_SECRET   # optional: the Turnstile widget's secret key
# The README's "API gateway" section has the same steps in the Cloudflare dashboard instead.
name = "allwine-api"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://allwine.dk,https://www.allwine.dk"

# Per IP address, per Cloudflare location (approximate: Cloudflare counts in the background). Periods are 10 or 60 s.
# Keep these in step with LIMITS in index.js, which applies them itself when the bindings are missing.
[[ratelimits]]
name = "LIMIT_ALL"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "LIMIT_AUTH"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
