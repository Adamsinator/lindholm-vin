<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- what the page may load (see README, "Content-Security-Policy"); GitHub Pages can't send it as a header -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; script-src 'self' 'unsafe-eval'; frame-src 'none'; img-src 'self' data: blob: https://data.geopf.fr; connect-src 'self' https://allwine-api.adamlenzing.workers.dev">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AllWine — Wine atlas</title>
<meta name="description" content="Wine-region atlas: the grands and premiers crus of Burgundy, Champagne and Alsace, the Northern Rhône's crus and Bordeaux's appellations and 1855 châteaux, and Germany's Einzellagen, with your bottles on them.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>">
<link rel="canonical" href="https://allwine.dk/atlas.html">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C2D3E">
<script src="config.js?v=9"></script>
<style>
:root{
  --bg:#F7F4F1; --card:#FFFFFF; --card2:#FBF9F7; --ink:#2A2126; --muted:#756A70;
  --line:#E7DFDD; --accent:#7C2D3E; --accent-ink:#FFFFFF; --gold:#A87E2F; --chip:#F1EBE8;
  --gc:#8E2C45; --gc-ink:#FFFFFF; --pc:#D88E7C; --pc-ink:#3A1A21; --pcx:#EBC3B6; --ac:#B4683F; --ac-ink:#FFFFFF; --vc:#ECDDB9; --rg:#EFEADF;
  --mapbg:#F4F1EA; --sel:#1F1418; --halo:#FFFFFF; --r:10px;
  --forest:#DCE5D3; --water:#7FA8C9; --lake:#CFE0EC; --town:#E4DCD7; --rfill:#FFFFFF; --rcase:#C9BDB6; --rmain:#E9C27A;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171114; --card:#221A1F; --card2:#281F24; --ink:#EFE7E8; --muted:#A5949C;
    --line:#382C32; --accent:#C86A7C; --accent-ink:#1D1216; --gold:#C99B47; --chip:#2E2329;
    --gc:#B6475F; --gc-ink:#FFF4F6; --pc:#8A4E44; --pc-ink:#FBE9E4; --pcx:#5E3B35; --ac:#A9683F; --ac-ink:#FFF6EF; --vc:#4D4232; --rg:#2C2622;
    --mapbg:#1E181B; --sel:#FFFFFF; --halo:#1E181B;
    --forest:#23302A; --water:#4F7A9C; --lake:#24323D; --town:#332A2E; --rfill:#4A3F44; --rcase:#2A2226; --rmain:#8A6A33;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1800px;margin:0 auto;padding:18px clamp(12px,2.2vw,36px) 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:12px}
header.top h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:clamp(24px,3.4vw,32px);font-weight:600;margin:0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header.top h1 em{font-style:italic;color:var(--accent)} header.top h1 a{color:inherit;text-decoration:none}
.ttl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.hright{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hright a{color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
.langpick{display:flex;gap:4px}
.langpick button{width:30px;height:21px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;overflow:hidden;opacity:.55}
.langpick button svg{width:100%;height:100%;display:block} .langpick button.on{opacity:1;border-color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.toolbar select,.toolbar input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);max-width:100%;min-width:0}
.toolbar input[type=search]{flex:1 1 220px}
.chk{display:flex;align-items:center;gap:5px;font-size:13.5px;cursor:pointer;user-select:none}
.chk i{width:12px;height:12px;border-radius:3px;display:inline-block}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.mapbox{position:relative;background:var(--mapbg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:min(78vh,820px);touch-action:none}
@media(max-width:900px){.mapbox{height:62vh}}
#map{width:100%;height:100%;display:block;cursor:grab;user-select:none} #map.drag{cursor:grabbing}
#map .rg{fill:var(--rg);stroke:none} #map .vl{fill:var(--vc);stroke:none;opacity:.75}
#map .cl{stroke:var(--card);stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
#map .cl.GC{fill:var(--gc)} #map .cl.AOC{fill:var(--ac)} #map .cl.p1{fill:var(--pc)} #map .cl.px{fill:var(--pcx)}
#map .cl:hover{filter:brightness(1.08)} #map .cl.sel{stroke:var(--sel);stroke-width:2.5}
#map .cl.dim{opacity:.18}
#map .lb{font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;pointer-events:none;text-anchor:middle;font-weight:600}
#map .lb.GC,#map .lb.AOC{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:14.5px}
#map .pt{fill:var(--ink);stroke:var(--card);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer} #map .pt.has{fill:var(--gold)} #map .pt.sel{stroke:var(--accent);stroke-width:3}
#map .lb.pl{font-size:11.5px;font-weight:600;font-style:italic}
#map .land{fill:var(--card2);stroke:var(--line);stroke-width:1} #map .land.on{fill:var(--rg)}
#map .hd{cursor:pointer} #map .hd circle{fill:var(--gc);stroke:var(--card);stroke-width:2} #map .hd.out circle{fill:var(--accent)} #map .hd:hover circle,#map .hd:focus circle{fill:var(--gold)}
#map .hd text{font-size:15px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
/* the ground (IGN): relief multiplies over the colours; roads and rivers thin, over the vineyards; names under theirs */
#map .shade{mix-blend-mode:multiply;opacity:.38}
@media (prefers-color-scheme: dark){ #map .shade{mix-blend-mode:screen;opacity:.16} }
#map .t-wood{fill:var(--forest);fill-opacity:.8} #map .t-town{fill:var(--town)} #map .t-lake{fill:var(--lake)}
#map .t-water,#map .t-case,#map .t-fill,#map .t-rail,#map .t-rail2{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#map .t-water{stroke:var(--water)} #map .t-w1{stroke-width:2.4} #map .t-w2{stroke-width:1;stroke-opacity:.8;display:none} #map.lod-mid .t-w2{display:inline}
#map .t-case{stroke:var(--rcase)} #map .t-fill{stroke:var(--rfill)}
#map .t-case.t-r1{stroke-width:4.6} #map .t-fill.t-r1{stroke-width:2.8;stroke:var(--rmain)}
#map .t-case.t-r2{stroke-width:3.2} #map .t-fill.t-r2{stroke-width:1.8}
#map .t-case.t-r2,#map .t-fill.t-r2{display:none} #map.lod-mid .t-case.t-r2,#map.lod-mid .t-fill.t-r2{display:inline}
#map .t-case.t-r3{stroke-width:2.4;display:none} #map .t-fill.t-r3{stroke-width:1.2;display:none} #map.lod-near .t-r3{display:inline}
#map .t-rail{stroke:var(--muted);stroke-width:2.4} #map .t-rail2{stroke:var(--mapbg);stroke-width:1.2;stroke-dasharray:6 6}
#map .tn{text-anchor:middle;dominant-baseline:central;fill:var(--muted);paint-order:stroke;stroke:var(--halo);stroke-opacity:.85;stroke-linejoin:round;font-size:12px}
#map .tn-1,#map .tn-2{fill:var(--ink);font-weight:700;letter-spacing:.02em} #map .tn-3{fill:var(--ink)} #map .tn-w{font-style:italic;fill:var(--water)}
body.home #fSearch,body.home .chk,body.home .zoom,body.home .legend{display:none !important} body.home #map{cursor:default}
#map .dot{fill:var(--gold);stroke:var(--card);stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.legend{position:absolute;left:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;display:flex;flex-direction:column;gap:3px;max-width:calc(100% - 70px)}
.legend span{display:flex;align-items:center;gap:6px} .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
aside#side{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media(max-width:900px){aside#side{position:static;max-height:none}}
#side h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:24px;margin:4px 0 2px;line-height:1.2}
#side h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:16px 0 6px}
#side .meta{color:var(--muted);font-size:13.5px}
#side .pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--chip);margin-right:4px}
#side .pill.GC{background:var(--gc);color:var(--gc-ink)} #side .pill.AOC{background:var(--ac);color:var(--ac-ink)} #side .pill.p1{background:var(--pc);color:var(--pc-ink)}
#side .facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
#side .fact{border-top:1px solid var(--line);padding-top:4px} #side .fact .l{font-size:11.5px;color:var(--muted)} #side .fact .v{font-family:"Iowan Old Style",Georgia,serif;font-size:19px}
#side .note{font-size:13px;color:var(--muted)} #side .cw{font-size:13.5px;padding:3px 0;border-top:1px solid var(--line)} #side .cw b{color:var(--gold)}
#side ul.list{list-style:none;margin:0;padding:0} #side ul.list li{padding:5px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:14px}
#side ul.list button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-align:left}
.btn{font:inherit;font-size:14px;font-weight:600;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.src{font-size:12px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1><a href="./">All<em>Wine</em></a><span class="ttl"><span data-i18n>Wine atlas</span><span id="regionName"></span></span></h1>
  <div class="hright"><div data-langpick></div><a href="burgundy.html" data-i18n>Côte d'Or atlas</a><a href="./" data-i18n>← AllWine</a></div>
</header>
<div class="toolbar" role="search">
  <select id="fRegion" aria-label="Region" data-i18n-aria></select>
  <input type="search" id="fSearch" list="climatList" placeholder="Find a vineyard…" aria-label="Find a vineyard" data-i18n-ph data-i18n-aria><datalist id="climatList"></datalist>
  <label class="chk"><input type="checkbox" id="fGC" checked><i style="background:var(--gc)"></i><span data-i18n>Grand cru</span></label>
  <label class="chk"><input type="checkbox" id="f1er" checked><i style="background:var(--pc)"></i><span data-i18n>Premier cru</span></label>
  <label class="chk"><input type="checkbox" id="fAOC" checked><i style="background:var(--ac)"></i><span data-i18n>Cru appellation</span></label>
  <label class="chk"><input type="checkbox" id="fEL" checked><i style="background:var(--pc)"></i><span data-i18n>Einzellage</span></label>
  <label class="chk"><input type="checkbox" id="fPts" checked><i style="background:var(--ink);border-radius:50%"></i><span data-i18n>Classified châteaux</span></label>
  <label class="chk"><input type="checkbox" id="fMine"><span data-i18n>Only my bottles</span></label>
  <label class="chk" hidden><input type="checkbox" id="fRelief"><span data-i18n>Relief</span></label>
  <label class="chk" hidden><input type="checkbox" id="fTopo"><span data-i18n>Roads, rivers, villages</span></label>
</div>
<div class="layout">
  <div class="mapbox">
    <svg id="map" role="img" aria-label="Vineyard map" data-i18n-aria></svg>
    <div class="zoom"><button type="button" id="zIn" aria-label="Zoom in" data-i18n-aria>+</button><button type="button" id="zOut" aria-label="Zoom out" data-i18n-aria>−</button><button type="button" id="zHome" aria-label="Whole region" data-i18n-aria>⌂</button></div>
    <div class="legend" id="legend"></div>
  </div>
  <aside id="side" aria-live="polite"></aside>
</div>
</div>
<script src="i18n.js?v=55"></script>
<script src="europe-lands.js?v=1"></script>
<script src="atlas.js?v=7"></script>
</body>
</html>
