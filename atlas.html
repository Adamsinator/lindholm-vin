<style>
:root{
  --bg:#F7F4F1; --card:#FFFFFF; --card2:#FBF9F7; --ink:#2A2126; --muted:#756A70;
  --line:#E7DFDD; --accent:#7C2D3E; --accent-ink:#FFFFFF; --gold:#A87E2F; --chip:#F1EBE8;
  --gc:#8E2C45; --gc-ink:#FFFFFF; --pc:#D88E7C; --pc-ink:#3A1A21; --pcx:#EBC3B6; --ac:#B4683F; --ac-ink:#FFFFFF; --vc:#ECDDB9; --rg:#EFEADF;
  --mapbg:#F4F1EA; --sel:#1F1418; --halo:#FFFFFF; --r:10px;
  --forest:#DCE5D3; --water:#7FA8C9; --lake:#CFE0EC; --town:#E4DCD7; --rfill:#FFFFFF; --rcase:#C9BDB6; --rmain:#E9C27A;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171114; --card:#221A1F; --card2:#281F24; --ink:#EFE7E8; --muted:#A5949C;
    --line:#382C32; --accent:#C86A7C; --accent-ink:#1D1216; --gold:#C99B47; --chip:#2E2329;
    --gc:#B6475F; --gc-ink:#FFF4F6; --pc:#8A4E44; --pc-ink:#FBE9E4; --pcx:#5E3B35; --ac:#A9683F; --ac-ink:#FFF6EF; --vc:#4D4232; --rg:#2C2622;
    --mapbg:#1E181B; --sel:#FFFFFF; --halo:#1E181B;
    --forest:#23302A; --water:#4F7A9C; --lake:#24323D; --town:#332A2E; --rfill:#4A3F44; --rcase:#2A2226; --rmain:#8A6A33;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1800px;margin:0 auto;padding:18px clamp(12px,2.2vw,36px) 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:12px}
header.top h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:clamp(24px,3.4vw,32px);font-weight:600;margin:0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header.top h1 em{font-style:italic;color:var(--accent)} header.top h1 a{color:inherit;text-decoration:none}
.ttl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.hright{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.helpq{display:inline-flex;align-items:center;justify-content:center;min-width:30px;min-height:30px;padding:0 !important;border:1.5px solid currentColor;border-radius:50%;font-weight:700;text-decoration:none;line-height:1}
@media(pointer:coarse){.helpq{min-width:44px;min-height:44px}}
.helpq-m{display:none !important;margin-left:10px;font-family:system-ui,sans-serif;font-size:15px;color:var(--accent)}
@media(max-width:560px){.helpq-d{display:none !important}.helpq-m{display:inline-flex !important;vertical-align:middle}}
.hright a{color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
.langpick{display:flex;gap:4px}
.langpick button{width:30px;height:21px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;overflow:hidden;opacity:.55}
.langpick button svg{width:100%;height:100%;display:block} .langpick button.on{opacity:1;border-color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.toolbar select,.toolbar input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);max-width:100%;min-width:0}
.toolbar .sbox{position:relative;flex:1 1 220px;min-width:0} .toolbar input[type=search]{width:100%}
/* the search's results, under the box */
.gres{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px 0;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:60vh;overflow:auto}
.gres li{display:flex;flex-direction:column;gap:1px;padding:8px 12px;cursor:pointer;min-height:44px;justify-content:center}
.gres li small{color:var(--muted);font-size:12.5px} .gres li[aria-selected=true],.gres li:hover{background:var(--card2)} .gres li.none{color:var(--muted);cursor:default}
.chk{display:flex;align-items:center;gap:5px;font-size:13.5px;cursor:pointer;user-select:none}
.chk i{width:12px;height:12px;border-radius:3px;display:inline-block}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.mapbox{position:relative;background:var(--mapbg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:min(78vh,820px);touch-action:none}
@media(max-width:900px){.mapbox{height:62vh}}
#map{width:100%;height:100%;display:block;cursor:grab;user-select:none} #map.drag{cursor:grabbing}
/* during a drag or pinch the drawing is moved as a picture (atlas.js setView): on this div, which the compositor moves */
#mapview{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
#map .rg{fill:var(--rg);stroke:none} #map .vl{fill:var(--vc);stroke:none;opacity:.75}
#map .cl{stroke:var(--card);stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
#map .cl.GC{fill:var(--gc)} #map .cl.AOC{fill:var(--ac)} #map .cl.p1{fill:var(--pc)} #map .cl.px{fill:var(--pcx)}
#map .cl:hover{filter:brightness(1.08)} #map .cl.sel{stroke:var(--sel);stroke-width:2.5}
#map .cl.dim{opacity:.18}
/* geology on: BRGM's colours under the vineyards, which keep only their outlines */
#map .geol{opacity:.85}
#map.geolon .cl{fill:transparent;stroke:var(--ink);stroke-width:1.1} #map.geolon .cl.sel{stroke:var(--sel);stroke-width:3} #map.geolon .cl:hover{filter:none;stroke-width:2}
#map.geolon .rg{fill:none} #map.geolon .vl{fill:none;stroke:var(--ink);stroke-opacity:.45;stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:4 3}
#map .lb{font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;pointer-events:none;text-anchor:middle;font-weight:600}
#map .lb.GC,#map .lb.AOC{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:14.5px}
#map .pt{fill:var(--ink);stroke:var(--card);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer} #map .pt.has{fill:var(--gold)} #map .pt.sel{stroke:var(--accent);stroke-width:3}
#map .lb.pl{font-size:11.5px;font-weight:600;font-style:italic}
#map .land{fill:var(--card2);stroke:var(--line);stroke-width:1} #map .land.on{fill:var(--rg)}
#map .hd{cursor:pointer} #map .hd circle{fill:var(--gc);stroke:var(--card);stroke-width:2} #map .hd.out circle{fill:var(--accent)} #map .hd:hover circle,#map .hd:focus circle{fill:var(--gold)}
#map .hd text{font-size:15px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
/* the ground (IGN): relief multiplies over the colours; roads and rivers thin, over the vineyards; names under theirs */
#map .shade{mix-blend-mode:multiply;opacity:.38}
@media (prefers-color-scheme: dark){ #map .shade{mix-blend-mode:screen;opacity:.16} }
#map .t-wood{fill:var(--forest);fill-opacity:.8} #map .t-town{fill:var(--town)} #map .t-lake{fill:var(--lake)}
#map .t-water,#map .t-case,#map .t-fill,#map .t-rail,#map .t-rail2{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#map .t-water{stroke:var(--water)} #map .t-w1{stroke-width:2.4} #map .t-w2{stroke-width:1;stroke-opacity:.8;display:none} #map.lod-mid .t-w2{display:inline}
#map .t-case{stroke:var(--rcase)} #map .t-fill{stroke:var(--rfill)}
#map .t-case.t-r1{stroke-width:4.6} #map .t-fill.t-r1{stroke-width:2.8;stroke:var(--rmain)}
#map .t-case.t-r2{stroke-width:3.2} #map .t-fill.t-r2{stroke-width:1.8}
#map .t-case.t-r2,#map .t-fill.t-r2{display:none} #map.lod-mid .t-case.t-r2,#map.lod-mid .t-fill.t-r2{display:inline}
#map .t-case.t-r3{stroke-width:2.4;display:none} #map .t-fill.t-r3{stroke-width:1.2;display:none} #map.lod-near .t-r3{display:inline}
#map .t-rail{stroke:var(--muted);stroke-width:2.4} #map .t-rail2{stroke:var(--mapbg);stroke-width:1.2;stroke-dasharray:6 6}
#map .tn{text-anchor:middle;dominant-baseline:central;fill:var(--muted);paint-order:stroke;stroke:var(--halo);stroke-opacity:.85;stroke-linejoin:round;font-size:12px}
#map .tn-1,#map .tn-2{fill:var(--ink);font-weight:700;letter-spacing:.02em} #map .tn-3{fill:var(--ink)} #map .tn-w{font-style:italic;fill:var(--water)}
/* terrain search and compare, as in the Côte d'Or atlas */
.chip{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer} .chip.on{border-color:var(--accent);color:var(--accent)}
.terrbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:-2px 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13px}
.terrbar .tl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.terrbar input{width:64px;background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 6px;font:inherit;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden} .seg button{border:0;background:var(--card);color:var(--ink);padding:4px 8px;font:inherit;font-size:12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0} .seg button.on{background:var(--ink);color:var(--card)}
.cmpv{width:100%;border-collapse:collapse;font-size:13px} .cmpv td,.cmpv th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} .cmpv td:first-child{color:var(--muted);width:30%}
.plink{border:0;background:none;padding:0;color:var(--accent);font:inherit;cursor:pointer;text-align:left}
body.home .chip,body.home .terrbar{display:none !important}
@media(max-width:600px){#printBtn{display:none !important}}
/* printing (or saving as PDF): the map and the panel beside it, no controls */
@media print{
  header.top .hright,.toolbar,.terrbar,.zoom,.profile{display:none !important}
  body{background:#fff} .wrap{max-width:none;padding:0} .layout{grid-template-columns:1fr}
  .mapbox{height:auto;aspect-ratio:1.414;break-inside:avoid} #side{border:0;box-shadow:none}
}
#side .src a{color:var(--accent)} /* the credits' links, in the page's colours (the browser's blue is unreadable in dark mode) */
/* the slope profile, as in the Côte d'Or atlas */
#map.profiling{cursor:crosshair} .zoom button.on{border-color:var(--accent);color:var(--accent)}
#map .profline{stroke:var(--ink);stroke-width:2.2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
#map .profpt{fill:var(--card);stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke} #map .profdot{fill:var(--accent);stroke:var(--card);stroke-width:2;vector-effect:non-scaling-stroke}
.profile{position:absolute;left:10px;right:56px;bottom:10px;background:color-mix(in srgb,var(--card) 95%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 10px 6px;z-index:2;font-size:13px}
.profile .ph{margin:2px 30px 4px 0} .profile .phead{font-size:12.5px;margin-right:28px}
.profile .close{position:absolute;top:4px;right:6px;border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer}
.pchart{width:100%;height:150px;display:block;cursor:crosshair}
.pchart .pline{fill:none;stroke:var(--ink);stroke-width:1.6;vector-effect:non-scaling-stroke} .pchart .plab{font-size:11px;font-weight:650;fill:var(--ink)}
.pchart .pax{font-size:9.5px;fill:var(--muted)} .pchart .pgrid{stroke:var(--line);stroke-width:.6;vector-effect:non-scaling-stroke}
.pchart .pcur{stroke:var(--accent);stroke-width:1.4;vector-effect:non-scaling-stroke} .ptip{font-size:12px;color:var(--muted);min-height:16px}
.mapbox:has(.profile:not([hidden])) .legend{display:none}
body.home .chk,body.home .zoom,body.home .legend{display:none !important} body.home #map{cursor:default}
#map .dot{fill:var(--gold);stroke:var(--card);stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
/* where am I: the dot, and a word on where it is */
#map .me circle{fill:#2B6FD6;stroke:#fff;stroke-width:2.5;vector-effect:non-scaling-stroke} #map .me .acc{fill:#2B6FD6;fill-opacity:.15;stroke:none}
.maptoast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:calc(100% - 40px);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.maptoast[hidden]{display:none}
#map:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.legend{position:absolute;left:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;display:flex;flex-direction:column;gap:3px;max-width:calc(100% - 70px)}
.legend span{display:flex;align-items:center;gap:6px} .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
@media(max-width:600px){.legend .gl:nth-of-type(n+5){display:none}} .legend .gl i{flex:none;border:1px solid var(--line)} .legend .gl em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(340px,62vw)}
.cls{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line);margin-right:6px;vertical-align:-1px}
.geolt{width:100%;border-collapse:collapse;font-size:13px} .geolt td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top} .geolt td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
aside#side{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media(max-width:900px){aside#side{position:static;max-height:none}}
#side h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:24px;margin:4px 0 2px;line-height:1.2}
#side h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:16px 0 6px}
#side .meta{color:var(--muted);font-size:13.5px}
#side .pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--chip);margin-right:4px}
#side .pill.GC{background:var(--gc);color:var(--gc-ink)} #side .pill.AOC{background:var(--ac);color:var(--ac-ink)} #side .pill.p1{background:var(--pc);color:var(--pc-ink)}
#side .facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
#side .fact{border-top:1px solid var(--line);padding-top:4px} #side .fact .l{font-size:11.5px;color:var(--muted)} #side .fact .v{font-family:"Iowan Old Style",Georgia,serif;font-size:19px}
#side .note{font-size:13px;color:var(--muted)} #side .cw{font-size:13.5px;padding:3px 0;border-top:1px solid var(--line)} #side .cw b{color:var(--gold)}
#side ul.list{list-style:none;margin:0;padding:0} #side ul.list li{padding:5px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:14px}
#side ul.list button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-align:left}
/* a finger needs at least 24 px (WCAG 2.5.8): the flags and the lists' names, on a touch screen */
@media(pointer:coarse){.langpick button{width:36px;height:24px} #side ul.list button{min-height:28px} #side .plink{min-height:24px}}
.btn{font:inherit;font-size:14px;font-weight:600;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.src{font-size:12px;color:var(--muted);margin-top:14px}

/* ---------- the map's look: light, dark (whatever the device says) or IGN's aerial photos under the vineyards ---------- */
html[data-map="dark"]{--bg:#171114;--card:#221A1F;--card2:#281F24;--ink:#EFE7E8;--muted:#A5949C;--line:#382C32;--accent:#C86A7C;--accent-ink:#1D1216;--gold:#C99B47;--chip:#2E2329;
  --gc:#B6475F;--gc-ink:#FFF4F6;--pc:#8A4E44;--pc-ink:#FBE9E4;--pcx:#5E3B35;--ac:#A9683F;--ac-ink:#FFF6EF;--vc:#4D4232;--rg:#2C2622;--mapbg:#1E181B;--sel:#FFFFFF;--halo:#1E181B;
  --forest:#23302A;--water:#4F7A9C;--lake:#24323D;--town:#332A2E;--rfill:#4A3F44;--rcase:#2A2226;--rmain:#8A6A33;color-scheme:dark}
html[data-map="light"]{--bg:#F7F4F1;--card:#FFFFFF;--card2:#FBF9F7;--ink:#2A2126;--muted:#756A70;--line:#E7DFDD;--accent:#7C2D3E;--accent-ink:#FFFFFF;--gold:#A87E2F;--chip:#F1EBE8;
  --gc:#8E2C45;--gc-ink:#FFFFFF;--pc:#D88E7C;--pc-ink:#3A1A21;--pcx:#EBC3B6;--ac:#B4683F;--ac-ink:#FFFFFF;--vc:#ECDDB9;--rg:#EFEADF;--mapbg:#F4F1EA;--sel:#1F1418;--halo:#FFFFFF;
  --forest:#DCE5D3;--water:#7FA8C9;--lake:#CFE0EC;--town:#E4DCD7;--rfill:#FFFFFF;--rcase:#C9BDB6;--rmain:#E9C27A;color-scheme:light}
html[data-map="dark"] #map .shade{mix-blend-mode:screen;opacity:.16} html[data-map="light"] #map .shade{mix-blend-mode:multiply;opacity:.38}
#map.photo .rg,#map.photo .vl{fill-opacity:0} #map.photo .cl{fill-opacity:.5;stroke:#fff;stroke-width:1.4} #map.photo .cl.sel{fill-opacity:.7}
#map.photo .t-wood,#map.photo .t-town,#map.photo .t-lake{fill-opacity:0}
/* the breadcrumb, top left on the map */
/* where you are, top left on the map: AllWine's own type, the place in the serif, the count quiet beside it */
.crumb{position:absolute;left:10px;top:10px;z-index:6;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;max-width:calc(100% - 130px);padding:7px 14px 8px;border-radius:12px;
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-left:3px solid var(--accent);
  font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.crumb button{border:0;background:none;padding:0;font:inherit;color:var(--muted);cursor:pointer}
.crumb button[data-info],.crumb > span:first-child{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:16.5px;font-weight:600;color:var(--ink)}
.crumb button[data-info]{font-style:italic;color:var(--accent)}
.crumb .sep{color:var(--muted)} .crumb .n{color:var(--muted);font-size:12.5px}
.mmenu,.mbar,.sidex{display:none}
/* panels: a floating card on a wide screen, a sheet from the bottom on a phone */
.panel{position:fixed;right:24px;top:120px;z-index:60;width:min(360px,calc(100vw - 32px));max-height:calc(100vh - 150px);overflow:auto;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:18px;padding:14px 16px 16px;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.panel h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:22px;margin:0} .panel h2 em{color:var(--accent)}
.px{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;font-size:15px}
.styles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.styles button{border:0;background:none;padding:0;display:grid;gap:5px;justify-items:center;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
.styles button[aria-checked="true"]{color:var(--ink);font-weight:600} .styles button[aria-checked="true"] .th{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.styles button:disabled{opacity:.4;cursor:default}
.th{display:block;width:100%;aspect-ratio:1.15;border-radius:12px;border:1px solid var(--line)}
.th-light{background:radial-gradient(circle at 30% 40%,#8E2C45 0 14%,transparent 15%),radial-gradient(circle at 62% 58%,#D88E7C 0 18%,transparent 19%),radial-gradient(circle at 70% 25%,#ECDDB9 0 12%,transparent 13%),#F4F1EA}
.th-dark{background:radial-gradient(circle at 30% 40%,#B6475F 0 14%,transparent 15%),radial-gradient(circle at 62% 58%,#8A4E44 0 18%,transparent 19%),radial-gradient(circle at 70% 25%,#4D4232 0 12%,transparent 13%),#1E181B}
.th-photo{background:radial-gradient(circle at 30% 40%,rgba(142,44,69,.7) 0 14%,transparent 15%),radial-gradient(circle at 62% 58%,rgba(216,142,124,.7) 0 18%,transparent 19%),linear-gradient(135deg,#6f7f4a,#a69a6a 45%,#5d6b3c 70%,#8a8f63)}
.th-auto{background:linear-gradient(135deg,#F4F1EA 0 50%,#1E181B 50%)}
.pnote{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.pfilters:not(:empty){margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.pfilters .toolbar{flex-direction:column;align-items:stretch;gap:10px;margin:0} .pfilters .legend{position:static;margin-top:12px;box-shadow:none}
.pfilters .terrbar{margin-top:10px}
.pmenu{display:grid;gap:2px} .pmenu a{display:flex;gap:12px;align-items:center;padding:12px 6px;border-radius:12px;color:var(--ink);text-decoration:none;font-size:16px} .pmenu a:hover{background:var(--card2)}
.mlang{margin-top:12px;display:flex;justify-content:center}
@media(max-width:760px){
  /* the map is the screen */
  .wrap{padding:0} header.top,.wrap > .toolbar,.wrap > .terrbar{display:none !important}
  .layout{display:block} .mapbox{position:fixed;inset:0;height:auto;border:0;border-radius:0;z-index:1}
  .mapbox > .legend{display:none}
  .mmenu{display:grid;place-items:center;position:absolute;right:10px;top:10px;z-index:6;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.1)}
  .crumb{max-width:calc(100% - 76px)}
  /* the controls: a round column on the right */
  .mapbox .zoom{top:auto;bottom:calc(84px + env(safe-area-inset-bottom));right:10px;left:auto;flex-direction:column;gap:0;border-radius:24px;overflow:hidden;
    background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 2px 12px rgba(0,0,0,.12)}
  .mapbox .zoom button{width:48px;height:48px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;font-size:18px}
  .mapbox .zoom button:last-child{border-bottom:0}
  #zIn,#zOut,#pngBtn,#printBtn{display:none !important}
  /* the bottom: search and the regions as chips */
  .mbar{display:flex;gap:8px;align-items:center;position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6}
  .msearch{flex:none;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 12px rgba(0,0,0,.12)}
  .rchips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:5px;border-radius:999px;border:1px solid var(--line);
    background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(0,0,0,.12)}
  .rchips::-webkit-scrollbar{display:none}
  .rchips button{flex:none;display:flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:9px 14px;background:none;color:var(--ink);font:600 14px/1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
  .rchips button i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent))} .rchips button.on{background:var(--ink);color:var(--bg)}
  .srch{position:absolute;left:10px;right:10px;top:62px;z-index:7} .srch .sbox input{width:100%;font-size:16px;padding:12px 14px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
  /* panels and the vineyard's details slide up from the bottom */
  .panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:78dvh;border-radius:22px 22px 0 0;border-bottom:0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:atlUp .26s cubic-bezier(.2,.8,.2,1)}
  .panel::before,.sidewrap::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
  .sidewrap{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:46dvh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
    box-shadow:0 -12px 40px rgba(0,0,0,.18);padding:10px 0 env(safe-area-inset-bottom);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  body.side-open .sidewrap{transform:none}
  /* the round controls stay above an open sheet, and in reach */
  body.side-open .mapbox .zoom{bottom:calc(var(--sheet,0px) + 12px);transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
  .sidewrap #side{border:0;box-shadow:none;margin:0}
  .sidex{display:grid;place-items:center;position:sticky;top:0;float:right;margin:-4px 12px 0 0;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;z-index:2}
  .profile{bottom:calc(84px + env(safe-area-inset-bottom))}
}
@keyframes atlUp{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}.sidewrap{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1><a href="./">All<em>Wine</em></a><span class="ttl"><span data-i18n>Wine atlas</span><span id="regionName"></span></span><a href="help.html#atlas" class="helpq helpq-m" title="Help and tips" aria-label="Help and tips" data-i18n-title data-i18n-aria>?</a></h1>
  <div class="hright"><div data-langpick></div><a href="burgundy.html" data-i18n>Côte d'Or atlas</a><a href="help.html#atlas" class="helpq helpq-d" title="Help and tips" aria-label="Help and tips" data-i18n-title data-i18n-aria>?</a><a href="./" data-i18n>← AllWine</a></div>
</header>
<div class="toolbar" role="search">
  <select id="fRegion" aria-label="Region" data-i18n-aria></select>
  <div class="sbox"><input type="search" id="fSearch" placeholder="Find a vineyard…" aria-label="Find a vineyard" data-i18n-ph data-i18n-aria role="combobox" aria-autocomplete="list" aria-controls="gRes" aria-expanded="false" autocomplete="off">
    <ul class="gres" id="gRes" role="listbox" aria-label="Vineyards found" data-i18n-aria hidden></ul></div>
  <label class="chk"><input type="checkbox" id="fGC" checked><i style="background:var(--gc)"></i><span data-i18n>Grand cru</span></label>
  <label class="chk"><input type="checkbox" id="f1er" checked><i style="background:var(--pc)"></i><span data-i18n>Premier cru</span></label>
  <label class="chk"><input type="checkbox" id="fAOC" checked><i style="background:var(--ac)"></i><span data-i18n>Cru appellation</span></label>
  <label class="chk"><input type="checkbox" id="fEL" checked><i style="background:var(--pc)"></i><span data-i18n>Einzellage</span></label>
  <label class="chk"><input type="checkbox" id="fPts" checked><i style="background:var(--ink);border-radius:50%"></i><span data-i18n>Classified châteaux</span></label>
  <label class="chk"><input type="checkbox" id="fMine"><span data-i18n>Only my bottles</span></label>
  <button type="button" class="chip" id="terrChip" aria-expanded="false" data-i18n hidden>Terrain…</button>
  <label class="chk" hidden><input type="checkbox" id="fRelief"><span data-i18n>Relief</span></label>
  <label class="chk" hidden><input type="checkbox" id="fTopo"><span data-i18n>Roads, rivers, villages</span></label>
  <label class="chk" hidden><input type="checkbox" id="fGeol"><span data-i18n>Geology</span></label>
</div>
<div class="terrbar" id="terrbar" hidden>
  <span class="tl" data-i18n>Faces</span>
  <div class="seg" id="tAsp" role="group" aria-label="Faces" data-i18n-aria></div>
  <label><span data-i18n>Altitude</span> <input type="number" id="tAltMin" min="0" max="900" step="10" placeholder="min"> – <input type="number" id="tAltMax" min="0" max="900" step="10" placeholder="max"> m</label>
  <label><span data-i18n>Slope</span> ≥ <input type="number" id="tSlope" min="0" max="80" step="1" placeholder="0"> %</label>
  <label><span data-i18n>Size</span> ≤ <input type="number" id="tSize" min="0" max="10000" step="0.5" placeholder="ha"> ha</label>
  <span class="tl" data-i18n>Quick:</span>
  <button type="button" class="chip" data-preset="steep" data-i18n>Steepest</button><button type="button" class="chip" data-preset="high" data-i18n>Highest</button><button type="button" class="chip" data-preset="south" data-i18n>South-facing</button><button type="button" class="chip" data-preset="small" data-i18n>Under 1 ha</button>
  <button type="button" class="chip" id="tClear" data-i18n>Clear</button>
</div>
<div class="layout">
  <div class="mapbox">
    <div id="mapview"><svg id="map" role="img" aria-label="Vineyard map" data-i18n-aria></svg></div>
    <nav class="crumb" id="crumb" aria-label="Where you are" data-i18n-aria></nav>
    <button type="button" class="mmenu" id="menuBtn" aria-label="Menu" aria-haspopup="dialog" data-i18n-aria><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="mbar" id="mbar"><button type="button" class="msearch" id="srchBtn" aria-label="Find a vineyard" data-i18n-aria><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button><div class="rchips" id="rchips" role="group" aria-label="Regions" data-i18n-aria></div></div>
    <div class="srch" id="srch" hidden></div>
    <div class="zoom"><button type="button" id="styleBtn" title="Map style and layers" aria-label="Map style and layers" aria-haspopup="dialog" data-i18n-title data-i18n-aria><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6z"/><path d="M9 4v14M15 6v14"/></svg></button><button type="button" id="zIn" aria-label="Zoom in" data-i18n-aria>+</button><button type="button" id="locBtn" title="Where am I?" aria-label="Where am I?" data-i18n-title data-i18n-aria hidden>◉</button><button type="button" id="zOut" aria-label="Zoom out" data-i18n-aria>−</button><button type="button" id="zHome" aria-label="Whole region" data-i18n-aria>⌂</button><button type="button" id="profBtn" aria-label="Slope profile" title="Slope profile" data-i18n-aria hidden>⟋</button><button type="button" id="pngBtn" title="Save this view as an image" aria-label="Save this view as an image" data-i18n-title data-i18n-aria>⤓</button><button type="button" id="printBtn" title="Print or save as PDF" aria-label="Print or save as PDF" data-i18n-title data-i18n-aria>⎙</button></div>
    <div class="profile" id="profile" hidden></div>
    <div class="maptoast" id="mapToast" role="status" hidden></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="sidewrap" id="sideWrap"><button type="button" class="sidex" id="sideX" aria-label="Close" data-i18n-aria>✕</button><aside id="side" aria-live="polite"></aside></div>
</div>
</div>
<div class="panel" id="stylePanel" role="dialog" aria-labelledby="styleTitle" hidden>
  <div class="panel-h"><h2 id="styleTitle" data-i18n>Map</h2><button type="button" class="px" data-close aria-label="Close" data-i18n-aria>✕</button></div>
  <div class="styles" id="styles" role="radiogroup" aria-label="Map style" data-i18n-aria>
    <button type="button" role="radio" data-style="auto"><i class="th th-auto"></i><span data-i18n>Automatic</span></button>
    <button type="button" role="radio" data-style="light"><i class="th th-light"></i><span data-i18n>Light</span></button>
    <button type="button" role="radio" data-style="dark"><i class="th th-dark"></i><span data-i18n>Dark</span></button>
    <button type="button" role="radio" data-style="photo"><i class="th th-photo"></i><span data-i18n>Aerial photo</span></button>
  </div>
  <p class="pnote" id="photoNote" hidden data-i18n>Aerial photos: IGN, France only.</p>
  <div class="pfilters" id="pFilters"></div>
</div>
<div class="panel" id="menuPanel" role="dialog" aria-labelledby="menuTitle" hidden>
  <div class="panel-h"><h2 id="menuTitle">All<em>Wine</em></h2><button type="button" class="px" data-close aria-label="Close" data-i18n-aria>✕</button></div>
  <nav class="pmenu"><a href="./"><span aria-hidden="true">🍷</span><span data-i18n>Your cellar</span></a><a href="burgundy.html"><span aria-hidden="true">🗺</span><span data-i18n>Côte d'Or atlas</span></a><a href="help.html#atlas"><span aria-hidden="true">?</span><span data-i18n>Help and tips</span></a><a href="privacy.html"><span aria-hidden="true">🔏</span><span data-i18n>Privacy</span></a></nav>
  <div class="mlang" data-langpick></div>
</div>
<script src="i18n.js?v=69"></script>
<script src="europe-lands.js?v=1"></script>
<script src="atlas.js?v=17"></script>
